# El proxy de Coolify termina TLS y conserva el dominio de la petición.
map $http_x_forwarded_proto $original_proto {
    default http;
    https https;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 200m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "oj-backend:8000";

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    location = /healthz {
        access_log off;
        try_files /index.html =503;
    }
    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location ~ ^/(api|public)/ {
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_proto;
        proxy_read_timeout 60s;
    }
    location = /admin { return 308 /admin/; }
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
    }
    location /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
