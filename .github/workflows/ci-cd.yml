name: Integración y entrega de frontend

on:
  pull_request:
    branches: [main, integracion/produccion-lizardjudge]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Producción se serializa hasta terminar la promoción; cancelar un push al registro no es atómico.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/incubadoradesarrollo-source/f-lizard-judge

jobs:
  checks:
    name: Comprobaciones e imagen validada
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configurar Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Preparar entorno de comprobaciones
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: ci
          load: true
          tags: lizard-frontend-ci:local
          platforms: linux/amd64
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Comprobar scripts y protecciones de entrega
        run: |
          for script in ci/*.sh; do bash -n "$script"; done
          bash ci/test-delivery.sh
      - name: Construir imagen de producción
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: runtime
          load: true
          tags: lizard-frontend:local
          platforms: linux/amd64
          build-args: |
            APP_REVISION=${{ github.sha }}
            PUBLIC_SENTRY_DSN=${{ vars.PUBLIC_SENTRY_DSN }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Probar arranque y healthcheck
        run: bash ci/smoke.sh
      - name: Guardar exactamente la imagen comprobada
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save lizard-frontend:local -o /tmp/imagen.tar
      - name: Entregar imagen al job de publicación
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: imagen-frontend
          path: /tmp/imagen.tar
          retention-days: 1
          compression-level: 0

  publish:
    name: Publicar SHA y promover latest
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Obtener scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rechazar ejecuciones antiguas
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/assert-main.sh
      - name: Recuperar imagen comprobada
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: imagen-frontend
          path: /tmp/imagen
      - name: Autenticar GHCR con GITHUB_TOKEN
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configurar Buildx para promoción
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Publicar etiqueta de commit sin sobrescribir versiones existentes
        run: |
          set -euo pipefail
          if ! docker manifest inspect "$IMAGE:$GITHUB_SHA" > /dev/null 2>&1; then
            docker load -i /tmp/imagen/imagen.tar
            docker tag lizard-frontend:local "$IMAGE:$GITHUB_SHA"
            docker push "$IMAGE:$GITHUB_SHA"
          fi
      - name: Promover la imagen actual a latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ci/assert-main.sh
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$GITHUB_SHA"
          echo "Imagen publicada: $IMAGE:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Solicitar despliegue en Coolify
    needs: publish
    if: vars.COOLIFY_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Obtener scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Comprobar revisión vigente
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/assert-main.sh
      - name: Llamar webhook autenticado
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: bash ci/deploy-coolify.sh
